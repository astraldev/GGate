name: Deb Build

on:
  release:
    types: [published]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            git build-essential devscripts debhelper dh-python \
            meson ninja-build pkg-config \
            python3-dev python3-gi-dev libcairo2-dev \
            libgtk-4-dev libadwaita-1-dev \
            python3-gi python3-gi-cairo python3-igraph python3-shapely python3-packaging

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Stage debian/, generate changelog, and build package
        run: |
          cp -r build-aux/debian debian
          python3 build-aux/gen-deb-changelog.py > debian/changelog
          dpkg-buildpackage -us -uc -b

      - name: Upload deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: ggate-deb
          path: ../ggate_*.deb

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          files: ../ggate_*.deb
