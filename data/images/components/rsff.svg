<svg viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
  <rect x="6" y="4" width="16" height="20" rx="1" ry="1" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  <!-- S input top, R input bottom — no clock triangle (distinguishes from clocked FFs) -->
  <line x1="1" y1="8" x2="6" y2="8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <line x1="1" y1="20" x2="6" y2="20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <!-- Q and ~Q outputs -->
  <line x1="22" y1="8" x2="27" y2="8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="20" x2="27" y2="20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <!-- Cross-coupling suggestion: two diagonal lines indicating NOR/NAND feedback -->
  <line x1="10" y1="9" x2="18" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="19" x2="18" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
</svg>
