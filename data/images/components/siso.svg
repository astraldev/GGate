<svg viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
  <rect x="5" y="4" width="18" height="20" rx="1" ry="1" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  <!-- Serial in: 1 pin at centre-left -->
  <line x1="1" y1="14" x2="5" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <!-- Serial out: 1 pin at centre-right -->
  <line x1="23" y1="14" x2="27" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <!-- Right-arrow (chevron) inside, implying shift direction -->
  <path d="M 9,14 L 16,14 M 13,10 L 17,14 L 13,18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
